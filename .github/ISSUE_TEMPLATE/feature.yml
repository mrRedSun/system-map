name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first; a proposed solution is welcome but optional.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
  - type: textarea
    id: data
    attributes:
      label: Data model impact
      description: New or changed YAML fields, if any (fictional example, please).
