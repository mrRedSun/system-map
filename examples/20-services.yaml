# yaml-language-server: $schema=../schema/system-map.schema.json

# Stacks group apps in the Apps graph. Services without `stack` land in "Other".
stacks:
  - id: edge
    name: Edge and access
    color: blue
    order: 1
    summary: How requests from the internet reach the apps, and who is let in.
    description: |
      Requests for `*.example.net` go through Cloudflare to the router, which forwards ports
      80 and 443 to [[traefik]]. Traefik picks the app by hostname. Private apps first send the
      visitor to [[authelia]] for a password and a one-time code.

      Inside the house, [[adguard]] answers DNS for every device, and [[wireguard]] lets a phone
      join the home network from outside.
  - id: media
    name: Media
    color: violet
    order: 2
    summary: Asking for a film or series, downloading it, and watching it on any screen.
    description: |
      1. Someone asks for a title in [[requests]].
      2. [[sonarr]] (series) or [[radarr]] (films) search the indexers through [[prowlarr]].
      3. The best release goes to [[qbittorrent]], which downloads into the media share.
      4. Sonarr or Radarr rename it into the library; [[bazarr]] adds subtitles.
      5. [[jellyfin]] picks it up and streams it.
  - id: home
    name: Home
    color: green
    order: 3
    summary: The smart home and the cameras.
  - { id: apps, name: Apps, color: teal, order: 4 }
  - { id: bots, name: Bots, color: pink, order: 5 }
  - { id: observability, name: Observability, color: amber, order: 6 }

services:
  - id: proxmox-ui
    name: Proxmox web UI
    summary: 'The admin console of the server: start, stop and back up every machine.'
    node: pve
    kind: native
    ports:
      - { port: 8006, proto: tcp, bind: 10.10.0.2, auth: own, exposure: lan, purpose: Web UI and API }
    urls:
      - { label: UI, url: 'https://10.10.0.2:8006/', internal: true }
    auth: own
    health: { kuma: [kuma-6] }

  - id: traefik
    name: Traefik
    summary: The front door. Every web request from outside arrives here and is sent on to the right app.
    node: vm-docker
    kind: container
    stack: edge
    image: traefik
    version: v3.6.2
    pin: traefik:v3.6.2
    ports:
      - { port: 443, proto: tcp, bind: 0.0.0.0, auth: none, exposure: public, purpose: HTTPS entrypoint }
      - { port: 8080, proto: tcp, bind: 127.0.0.1, auth: none, exposure: internal, purpose: Dashboard }
    auth: none
    calls:
      - { target: authelia, via: forwardAuth, port: 9091, purpose: Authentication }
      - { target: wiki, via: http, port: 3000 }
      - { target: photos, via: http, port: 2283 }
      - { target: uptime-kuma, via: http, port: 3001 }
      - { target: api.cloudflare.com, via: https, purpose: ACME DNS challenge }
    logs: { dozzle: { host: docker, container: traefik } }
    paths: { config: /opt/stacks/traefik, dynamic: /opt/stacks/traefik/dynamic }
    secrets:
      - { path: /opt/stacks/traefik/.env, purpose: Cloudflare DNS API token }
    update: { command: cd /opt/stacks/traefik && docker compose pull && docker compose up -d }

  - id: authelia
    name: Authelia
    summary: Asks for a password and a second factor before anyone outside reaches a private app.
    node: vm-docker
    kind: container
    stack: edge
    image: authelia/authelia
    version: 4.39.13
    pin: authelia/authelia:4.39.13
    ports:
      - { port: 9091, proto: tcp, auth: none, exposure: internal, purpose: forwardAuth and portal }
    auth: own
    calls:
      - { target: smtp.example.org, via: smtp, port: 587, purpose: Notifications }
    health: { kuma: [kuma-2] }
    logs: { dozzle: { host: docker, container: authelia } }
    notes: Two-factor (TOTP) is **required** for every user.

  - id: wiki
    name: Wiki
    summary: 'The household wiki: manuals, recipes and how-tos.'
    node: vm-docker
    kind: compose
    stack: apps
    image: example/wiki
    version: 2.4.1
    ports:
      - { port: 3000, proto: tcp, auth: authelia, exposure: public, purpose: Web }
    urls:
      - { label: Wiki, url: 'https://wiki.example.net/' }
    auth: authelia
    calls:
      - { target: wiki-db, via: postgres, port: 5432 }
    health: { kuma: [kuma-1] }
    logs: { dozzle: { host: docker, container: wiki } }
    backup: { how: pg_dump nightly, where: tank/backup/wiki }

  - id: wiki-db
    name: Wiki database
    summary: Database that stores the wiki pages.
    node: vm-docker
    kind: container
    stack: apps
    image: postgres
    version: '17.6'
    ports:
      - { port: 5432, proto: tcp, auth: own, exposure: internal }
    auth: own
    logs: { dozzle: { host: docker, container: wiki-db } }

  - id: photos
    name: Photos
    summary: Backs up phone photos and makes them searchable.
    node: vm-docker
    kind: compose
    stack: apps
    image: example/photos
    version: 1.140.0
    ports:
      - { port: 2283, proto: tcp, auth: own, exposure: public, purpose: Web and mobile app }
    urls:
      - { label: Photos, url: 'https://photos.example.net/' }
    auth: own
    health: { kuma: [kuma-3] }
    logs: { dozzle: { host: docker, container: photos } }

  - id: uptime-kuma
    name: Uptime Kuma
    summary: Checks every few minutes that apps answer, and alerts when one does not.
    node: vm-docker
    kind: container
    stack: observability
    image: louislam/uptime-kuma
    version: 2.0.2
    ports:
      - { port: 3001, proto: tcp, auth: authelia, exposure: restricted, purpose: Status UI and /metrics }
    auth: authelia
    calls:
      - { target: Telegram Bot API, via: https, purpose: Alerts }
      - { target: adguard, via: dns, purpose: DNS check, kind: observe }
    logs: { dozzle: { host: docker, container: uptime-kuma } }

  - id: dozzle
    name: Dozzle
    summary: Shows the live logs of the Docker containers in a browser.
    node: vm-docker
    kind: container
    stack: observability
    image: amir20/dozzle
    version: v11.4.2
    ports:
      - { port: 8080, proto: tcp, auth: none, exposure: lan, purpose: Log hub (read-only) }
    auth: none

  - id: adguard
    name: AdGuard Home
    summary: DNS for the home network; blocks ads and trackers for every device.
    node: ct-dns
    kind: native
    stack: edge
    version: v0.107.70
    ports:
      - { port: 53, proto: udp, auth: none, exposure: lan, purpose: DNS }
      - { port: 53, proto: tcp, auth: none, exposure: lan, purpose: DNS }
      - { port: 3000, proto: tcp, auth: own, exposure: lan, purpose: Admin UI }
    auth: own
    calls:
      - { target: Quad9, via: DNS-over-TLS, port: 853, purpose: Upstream resolver }
    health: { kuma: [kuma-4] }

  - id: jellyfin
    name: Jellyfin
    summary: Streams films and series to the TV, phones and browsers.
    node: ct-media
    kind: systemd
    stack: media
    version: 10.11.2
    ports:
      - { port: 8096, proto: tcp, auth: own, exposure: lan, purpose: Web and clients }
    auth: own
    health: { kuma: [kuma-5] }
    update: { command: apt update && apt install --only-upgrade jellyfin }

  - id: transcoder
    name: Batch transcoder
    node: ct-media
    kind: timer
    stack: media
    status: deliberately-stopped
    schedule: Sun 03:00
    notes: Disabled until the new hardware encoder settings are tested.

  - id: wireguard
    name: WireGuard
    summary: VPN that puts a phone or laptop on the home network from anywhere.
    node: router
    kind: native
    stack: edge
    ports:
      - { port: 51820, proto: udp, auth: key, exposure: public, purpose: VPN }
    auth: key

  # Media: requests → Sonarr/Radarr → Prowlarr/qBittorrent → the internet.
  - id: requests
    name: Requests
    summary: Where family members ask for a film or series; the request goes to Sonarr or Radarr.
    node: ct-media
    kind: container
    stack: media
    ports:
      - { port: 5055, proto: tcp, auth: own, exposure: public, purpose: Web }
    auth: own
    calls:
      - { target: sonarr, via: http, port: 8989, purpose: Add series }
      - { target: radarr, via: http, port: 7878, purpose: Add movies }
      - { target: jellyfin, via: http, port: 8096, purpose: Sign-in and availability }
      - { target: TMDB API, via: https, purpose: Metadata }

  - id: bazarr
    name: Bazarr
    summary: Finds subtitles for everything in the library.
    node: ct-media
    kind: container
    stack: media
    ports:
      - { port: 6767, proto: tcp, auth: own, exposure: lan, purpose: Web }
    auth: own
    calls:
      - { target: sonarr, via: http, port: 8989, purpose: Episode list }
      - { target: radarr, via: http, port: 7878, purpose: Movie list }
      - { target: OpenSubtitles API, via: https, purpose: Subtitles }

  - id: sonarr
    name: Sonarr
    summary: Finds TV episodes you want and sends them to qBittorrent.
    node: ct-media
    kind: container
    stack: media
    ports:
      - { port: 8989, proto: tcp, auth: own, exposure: lan, purpose: Web and API }
    auth: own
    calls:
      - { target: prowlarr, via: http, port: 9696, purpose: Indexer search }
      - { target: qbittorrent, via: http, port: 8081, purpose: Downloads }
      - { target: jellyfin, via: http, port: 8096, purpose: Library refresh }
      - { target: TVDB API, via: https, purpose: Metadata }
    health: { kuma: [kuma-10] }

  - id: radarr
    name: Radarr
    summary: Finds films you want and sends them to qBittorrent.
    node: ct-media
    kind: container
    stack: media
    ports:
      - { port: 7878, proto: tcp, auth: own, exposure: lan, purpose: Web and API }
    auth: own
    calls:
      - { target: prowlarr, via: http, port: 9696, purpose: Indexer search }
      - { target: qbittorrent, via: http, port: 8081, purpose: Downloads }
      - { target: jellyfin, via: http, port: 8096, purpose: Library refresh }
      - { target: tmdb api, via: https, purpose: Metadata }

  - id: prowlarr
    name: Prowlarr
    summary: Keeps the list of indexers and searches them for Sonarr and Radarr.
    node: ct-media
    kind: container
    stack: media
    ports:
      - { port: 9696, proto: tcp, auth: own, exposure: lan, purpose: Web and API }
    auth: own
    calls:
      - { target: indexers (internet), via: https, purpose: Search }

  - id: qbittorrent
    name: qBittorrent
    summary: Downloads what Sonarr and Radarr ask for.
    node: ct-media
    kind: container
    stack: media
    ports:
      - { port: 8081, proto: tcp, auth: own, exposure: lan, purpose: Web UI and API }
      - { port: 51413, proto: tcp, auth: none, exposure: public, purpose: Peers }
    auth: own
    calls:
      - { target: BitTorrent peers, via: bittorrent }

  # Home automation.
  - id: home-assistant
    name: Home Assistant
    summary: 'Runs the house: lights, heating, presence and automations.'
    node: ct-home
    kind: container
    stack: home
    ports:
      - { port: 8123, proto: tcp, auth: own, exposure: public, purpose: Web and app }
    auth: own
    calls:
      - { target: frigate, via: http, port: 5000, purpose: Events and clips }
      - { target: frigate, via: rtsp, port: 8554, purpose: Live camera streams }
      - { target: mosquitto, via: mqtt, port: 1883, purpose: Device state }
      - { target: phone, via: https, purpose: Push notifications }
      - { target: Telegram Bot API (long polling), via: https, purpose: Notifications }
    health: { kuma: [kuma-11] }
    logs: { dozzle: { host: home, container: homeassistant } }

  - id: frigate
    name: Frigate
    summary: Records the cameras and detects people and cars.
    node: ct-home
    kind: container
    stack: home
    ports:
      - { port: 5000, proto: tcp, auth: none, exposure: lan, purpose: Web and API }
      - { port: 8554, proto: tcp, auth: none, exposure: lan, purpose: RTSP restream }
    auth: none
    calls:
      - { target: cam-door, via: rtsp, port: 554, purpose: Camera stream }
      - { target: cam-garden, via: rtsp, port: 554, purpose: Camera stream }
      - { target: mosquitto, via: mqtt, port: 1883, purpose: Detection events }
    logs: { dozzle: { host: home, container: frigate } }

  - id: zigbee2mqtt
    name: Zigbee2MQTT
    summary: Talks to the Zigbee sensors and switches and passes their messages on over MQTT.
    node: ct-home
    kind: container
    stack: home
    ports:
      - { port: 8080, proto: tcp, auth: none, exposure: internal, purpose: Web }
    auth: none
    calls:
      - { target: mosquitto, via: mqtt, port: 1883, purpose: Device bridge }

  - id: mosquitto
    name: Mosquitto
    summary: Message bus between the sensors, Frigate and Home Assistant.
    node: ct-home
    kind: container
    stack: home
    ports:
      - { port: 1883, proto: tcp, auth: own, exposure: internal, purpose: MQTT }
    auth: own

  # Bots and dashboards.
  - id: notify-bot
    name: Notify bot
    summary: Sends alerts and daily summaries to the family Telegram chat.
    node: vm-docker
    kind: container
    stack: bots
    calls:
      - { target: route-home, via: https, purpose: Home Assistant API }
      - { target: Telegram Bot API, via: https, purpose: Messages }
    logs: { dozzle: { host: docker, container: notify-bot } }

  - id: homepage
    name: Homepage
    summary: Start page with a tile for every app and its status.
    node: vm-docker
    kind: container
    stack: observability
    ports:
      - { port: 3010, proto: tcp, auth: authelia, exposure: lan, purpose: Dashboard }
    auth: authelia
    calls:
      - { target: sonarr, via: http, purpose: Widget, kind: observe }
      - { target: radarr, via: http, purpose: Widget, kind: observe }
      - { target: qbittorrent, via: http, purpose: Widget, kind: observe }
      - { target: jellyfin, via: http, purpose: Widget, kind: observe }
      - { target: requests, via: http, purpose: Widget, kind: observe }
      - { target: home-assistant, via: http, purpose: Widget, kind: observe }
      - { target: uptime-kuma, via: http, purpose: Widget, kind: observe }
      - { target: adguard, via: http, purpose: Widget, kind: observe }
      - { target: proxmox-ui, via: https, purpose: Widget, kind: observe }
      - { target: photos, via: http, purpose: Widget, kind: observe }

  - id: system-map
    name: System Map
    summary: 'This map: the documentation of the whole system, with live health and logs.'
    node: vm-docker
    kind: container
    stack: observability
    ports:
      - { port: 8080, proto: tcp, auth: authelia, exposure: internal, purpose: Web }
    auth: authelia
    calls:
      - { target: uptime-kuma, via: http, purpose: Metrics, kind: observe }
      - { target: dozzle, via: http, purpose: Live logs, kind: observe }

  - id: old-dashboard
    name: Old dashboard
    node: vm-docker
    kind: container
    stack: observability
    status: retired
    notes: Replaced by Homepage.
    calls:
      - { target: jellyfin, via: http, kind: observe }
