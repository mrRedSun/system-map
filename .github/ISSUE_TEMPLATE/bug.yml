name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real infrastructure data (hostnames, IPs, domains, keys). Reduce the
        YAML to a small fictional example that shows the problem. Security issues: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal YAML snippet and the clicks or requests that show the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Image tag or commit
      placeholder: ghcr.io/mrredsun/system-map:sha-…
  - type: textarea
    id: logs
    attributes:
      label: Logs or validate output
      render: text
