name: Screenshots

# Regenerates docs/screenshots/ from the showcase demo and opens a pull request with the result.
# Runs only when started by hand; it never pushes to main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # push the screenshots branch
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: chore/regenerate-screenshots
          delete-branch: true
          add-paths: docs/screenshots/*.png
          commit-message: 'docs: regenerate screenshots'
          title: 'docs: regenerate screenshots'
          body: Screenshots regenerated from the showcase demo by the Screenshots workflow.
